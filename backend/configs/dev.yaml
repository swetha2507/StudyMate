generators:
  qgen:
    provider: local
    model_path: "outputs/phi3-learningq/merged"
    max_new_tokens: 512
    temperature: 0.0

  answer:
    provider: openai
    openai_model: "gpt-4o-mini"
    max_new_tokens: 320
    temperature: 0.0

retrieval:
  index_path: "./data/index"
  embed_model: "sentence-transformers/all-MiniLM-L6-v2"
  chunk_size: 700
  chunk_overlap: 120
  top_k_raw: 20
  top_k_keep: 3

reranker:
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  keep: 3

limits:
  context_tokens_budget: 3500
  support_ratio_threshold: 0.7

server:
  host: "127.0.0.1"
  port: 8080
